<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NosLegacy · Raid</title>
<style>
  :root {
    --s: 1;
    --navy0: #040a16; --navy1: #0a1730; --navy2: #102446; --navy3: #18355f; --navy4: #22497f;
    --line: #3b6db0; --glow: #6fb6ff; --txt: #e3eeff; --dim: #8ea7cc;
    --gold: #ffd36b; --gold2: #c8922e; --gold3: #7a5210;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #02060e; color: var(--txt);
    font: calc(12px * var(--s)) Tahoma, Verdana, sans-serif;
    user-select: none; overflow: hidden; padding: 3px;
  }
  svg { width: 1.25em; height: 1.25em; flex: none; vertical-align: middle; }

  /* Window frame: gold outer trim, blue inner trim, corner gems */
  .win {
    position: relative; height: 100%; display: flex; flex-direction: column;
    border: 2px solid var(--gold2); border-radius: 7px;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(80,150,255,.22), transparent 60%),
      linear-gradient(180deg, var(--navy2) 0%, var(--navy1) 45%, var(--navy0) 100%);
    box-shadow: 0 0 0 1px #000, inset 0 0 0 1px #000, inset 0 0 0 3px var(--line), inset 0 0 18px rgba(0,0,0,.75), 0 0 12px rgba(255,190,80,.25);
    padding: 5px;
  }
  .gem { position: absolute; width: 11px; height: 11px; transform: rotate(45deg); z-index: 3;
    background: radial-gradient(circle at 35% 35%, #fff6cf, var(--gold) 35%, var(--gold3)); border: 1px solid #000; box-shadow: 0 0 6px rgba(255,200,90,.8); }
  .gem.tl { top: -6px; left: -6px; } .gem.tr { top: -6px; right: -6px; } .gem.bl { bottom: -6px; left: -6px; } .gem.br { bottom: -6px; right: -6px; }

  /* Title bar */
  .top {
    display: flex; align-items: center; gap: 5px; padding: 4px 6px; margin: -1px -1px 5px;
    border: 1px solid var(--gold3); border-radius: 4px;
    background: linear-gradient(180deg, #2c5c9e 0%, #173a6c 50%, #0e2448 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -1px 0 rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.6);
  }
  .title { flex: 1; min-width: 0; font-weight: bold; font-size: 1.12em; color: #fff4d2; letter-spacing: .5px;
    text-shadow: 0 0 6px #e0a020, 1px 1px 0 #000, -1px -1px 0 #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sz {
    cursor: pointer; width: 1.9em; height: 1.65em; padding: 0; border-radius: 4px;
    border: 1px solid #000; outline: 1px solid var(--gold3); outline-offset: -2px;
    background: linear-gradient(180deg, #3a6db0, #183c70 55%, #0f2a52); color: #cfe2ff;
    font: bold .82em Tahoma, sans-serif; text-shadow: 1px 1px 0 #000;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 1px 2px rgba(0,0,0,.7); transition: filter .12s, box-shadow .12s;
  }
  .sz:hover { filter: brightness(1.25); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 0 6px rgba(111,182,255,.8); }
  .sz:active { transform: translateY(1px); }
  .sz.on { color: #fff3c4; outline-color: var(--gold); background: linear-gradient(180deg, #5a8fd6, #2a5aa0 55%, #1a3f78); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 0 7px rgba(255,210,110,.8); }

  /* Stats strip */
  .stats { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .chip {
    display: flex; align-items: center; gap: 4px; padding: 3px 7px; white-space: nowrap;
    border: 1px solid #000; border-radius: 4px; outline: 1px solid #2a548f; outline-offset: -2px;
    background: linear-gradient(180deg, #14305a, #0a1a35); box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  }
  .chip b { color: #fff; }
  .chip.dmg b { color: #ffb066; }
  .boss { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; }
  .hp { flex: 1; height: 1.15em; border: 1px solid #000; outline: 1px solid #6b2a1a; outline-offset: -2px; border-radius: 7px; background: #1a0605; overflow: hidden; position: relative; min-width: 30px; }
  .hp i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, #ff9a7a, #e8331f 50%, #8c0f06); box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
  .hp span { position: relative; display: block; text-align: center; font-size: .82em; line-height: 1.38em; color: #fff; font-weight: bold; text-shadow: 1px 1px 0 #000; }

  /* Podium */
  .podium {
    position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 4%;
    padding: .55em .4em .5em; margin-bottom: 5px; border-radius: 5px;
    border: 1px solid #000; outline: 1px solid var(--gold3); outline-offset: -3px;
    background: radial-gradient(ellipse at 50% 0%, #2b5a9a 0%, #12305a 45%, #081428 100%);
    box-shadow: inset 0 0 14px rgba(0,0,0,.7);
  }
  .podium::before { content: ''; position: absolute; left: 10%; right: 10%; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .pd { position: relative; text-align: center; width: 30%; min-width: 0; }
  .ring { position: relative; margin: 0 auto; border-radius: 50%; padding: .28em; }
  .ring img { display: block; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(#2a5590, #0a1830); }
  .pd1 .ring { width: 6.6em; height: 6.6em; background: conic-gradient(#fff3c4, #d9a23a, #fff3c4, #9a6410, #fff3c4); box-shadow: 0 0 16px rgba(255,200,90,.75); }
  .pd2 .ring { width: 5.2em; height: 5.2em; background: conic-gradient(#fff, #9aa8bc, #fff, #5a6a82, #fff); box-shadow: 0 0 10px rgba(200,220,255,.55); }
  .pd3 .ring { width: 5.2em; height: 5.2em; background: conic-gradient(#ffd1a6, #b86a2b, #ffd1a6, #7a3e12, #ffd1a6); box-shadow: 0 0 10px rgba(230,140,70,.55); }
  .pd1 { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 50% { filter: drop-shadow(0 0 5px rgba(255,210,110,.55)); } }
  .medal { position: absolute; bottom: -.35em; left: 50%; transform: translateX(-50%); width: 1.7em; height: 1.7em; border-radius: 50%;
    font: bold .95em/1.6em Tahoma, sans-serif; color: #2a1800; border: 1px solid #000; box-shadow: 0 1px 2px #000; }
  .pd1 .medal { background: radial-gradient(circle at 35% 30%, #fff8d8, #e6b14a 60%, #9a6410); }
  .pd2 .medal { background: radial-gradient(circle at 35% 30%, #fff, #b8c4d6 60%, #5a6a82); }
  .pd3 .medal { background: radial-gradient(circle at 35% 30%, #ffe2c4, #c97a38 60%, #7a3e12); }
  .crownTop { position: absolute; top: -.75em; left: 50%; transform: translateX(-50%); width: 1.6em; height: 1.6em; filter: drop-shadow(0 1px 1px #000); }
  .pnm { margin-top: .55em; font-weight: bold; color: #fff; text-shadow: 1px 1px 0 #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pd1 .pnm { color: var(--gold); font-size: 1.1em; }
  .pval { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 2px; font-weight: bold; }
  .podium .empty { padding: 1.2em 0; }

  /* Tabs */
  .tabs { display: flex; gap: 3px; padding: 0 2px; }
  .tab {
    flex: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; padding: 4px 0 3px;
    border: 1px solid #000; border-bottom: none; border-radius: 5px 5px 0 0; outline: 1px solid #2a548f; outline-offset: -2px;
    background: linear-gradient(180deg, #1b3a66, #0d2141); color: var(--dim); font: .85em Tahoma, sans-serif;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18); transition: filter .12s;
  }
  .tab:hover { filter: brightness(1.3); }
  .tab.on { color: #fff3c4; outline-color: var(--gold2); background: linear-gradient(180deg, #3d73bd, #1d4580); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 -2px 6px rgba(255,200,90,.35); }

  /* Player list */
  .list { flex: 1; overflow-y: auto; padding: 4px; border: 1px solid #000; outline: 1px solid var(--line); outline-offset: -2px; border-radius: 0 0 5px 5px;
    background: linear-gradient(180deg, #0c1d3a, #071224); box-shadow: inset 0 0 10px rgba(0,0,0,.7); }
  .list::-webkit-scrollbar { width: 9px; }
  .list::-webkit-scrollbar-track { background: #050c18; border-left: 1px solid #1a3358; }
  .list::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #3a74c0, #1d4378); border: 1px solid #000; border-radius: 4px; }
  .row { display: flex; align-items: center; gap: 5px; padding: 3px 6px 4px; margin-bottom: 3px; position: relative; overflow: hidden;
    border: 1px solid #000; border-radius: 4px; outline: 1px solid #234775; outline-offset: -2px;
    background: linear-gradient(180deg, #17345e, #0e2244); box-shadow: inset 0 1px 0 rgba(255,255,255,.1); transition: filter .12s; }
  .row:hover { filter: brightness(1.18); }
  .row.me { outline-color: var(--gold2); background: linear-gradient(180deg, #24467a, #142c55); box-shadow: inset 0 0 8px rgba(255,200,90,.3); }
  .row.head { background: none; border-color: transparent; outline: none; box-shadow: none; padding-top: 0; padding-bottom: 0; margin-bottom: 1px; }
  .rank { width: 1.5em; text-align: center; color: var(--dim); font-weight: bold; }
  .rank.r1 { color: var(--gold); text-shadow: 0 0 4px #c8922e; } .rank.r2 { color: #dfe7f3; } .rank.r3 { color: #e39a5a; }
  .ava { width: 1.9em; height: 1.9em; border-radius: 50%; border: 1px solid var(--gold3); background: #0a1830; flex: none; }
  .who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 3px; }
  .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; text-shadow: 1px 1px 0 #000; }
  .row.me .nm { color: var(--gold); }
  .dead { color: #ff8070; font-size: .85em; display: flex; align-items: center; }
  .vals { display: flex; gap: 7px; }
  .val { display: flex; align-items: center; gap: 2px; white-space: nowrap; min-width: 3.7em; justify-content: flex-end; font-weight: bold; text-shadow: 1px 1px 0 #000; }
  .fill { position: absolute; left: 0; bottom: 0; height: 3px; border-radius: 0 2px 2px 0; box-shadow: 0 0 4px currentColor; }
  .perf { display: inline-block; min-width: 2.3em; text-align: center; padding: 0 4px; border-radius: 8px; font-weight: bold; color: #0a1020;
    border: 1px solid rgba(0,0,0,.6); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); text-shadow: none; }
  .empty { text-align: center; color: var(--dim); padding: 20px 8px; line-height: 1.6; }

  .foot { margin-top: 5px; padding: 3px 6px; border-radius: 4px; border: 1px solid #000; outline: 1px solid #1d3a63; outline-offset: -2px;
    background: linear-gradient(180deg, #0d1f3d, #060f20); color: #7a93b8; font-size: .82em; text-align: center; }
  .foot b { color: var(--gold); }
</style>
</head>
<body>
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c0"/><stop offset="1" stop-color="#c8922e"/></linearGradient>
    </defs>
    <symbol id="i-sword" viewBox="0 0 24 24"><path fill="#ffb066" stroke="#5a2a00" stroke-width=".6" d="M20 2l2 2-9.5 9.5-2-2L20 2z"/><path fill="url(#gs)" stroke="#5a3a00" stroke-width=".6" d="M9 12l3 3-2 2-1-1-3.5 3.5-1.5-1.5L7.5 14.5 6.5 13.5 9 12z"/><path fill="#ff6a3a" d="M3 19l2 2-1.5 1.5-2-2z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path fill="#ff5d5d" stroke="#5a0a0a" stroke-width=".8" d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z"/><path fill="url(#gs)" d="M13 6l-4 7h3l-1 5 4-7h-3z"/></symbol>
    <symbol id="i-heal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#2bbd5a" stroke="#0a4a1e" stroke-width=".8"/><path fill="#fff" d="M10 6h4v4h4v4h-4v4h-4v-4H6v-4h4z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="url(#gs)" stroke="#7a5210" stroke-width=".8" d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7-6.3-3.6-6.3 3.6 1.5-7L2 9.3l7-.8z"/></symbol>
    <symbol id="i-all" viewBox="0 0 24 24"><path fill="#9fd0ff" d="M3 4h18v3H3zM3 10.5h18v3H3zM3 17h18v3H3z"/></symbol>
    <symbol id="i-time" viewBox="0 0 24 24"><path fill="#9fd0ff" stroke="#1a3a6a" stroke-width=".6" d="M6 2h12v2l-4.5 7 4.5 7v2H6v-2l4.5-7L6 4z"/><path fill="#ffd36b" d="M9 18l3-4 3 4z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path fill="#ff4d6d" stroke="#5a0a1a" stroke-width=".8" d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/></symbol>
    <symbol id="i-skull" viewBox="0 0 24 24"><path fill="#e8e8e8" d="M12 2C7 2 3.5 5.5 3.5 10c0 2.6 1.2 4.5 3 5.6V19h11v-3.4c1.8-1.1 3-3 3-5.6C20.5 5.5 17 2 12 2z"/><circle cx="8.8" cy="10.5" r="2" fill="#111"/><circle cx="15.2" cy="10.5" r="2" fill="#111"/><path fill="#111" d="M11 14h2l-1 2z"/><path fill="#e8e8e8" d="M8 19h2v3H8zM14 19h2v3h-2z"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path fill="url(#gs)" stroke="#7a5210" stroke-width=".8" d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z"/><circle cx="12" cy="14" r="1.6" fill="#ff4d6d"/></symbol>
  </svg>

  <div class="win">
    <i class="gem tl"></i><i class="gem tr"></i><i class="gem bl"></i><i class="gem br"></i>
    <div class="top">
      <svg><use href="#i-skull"/></svg>
      <div class="title" id="title">Raid</div>
      <button class="sz" data-size="0.85">S</button>
      <button class="sz" data-size="1">M</button>
      <button class="sz" data-size="1.2">L</button>
    </div>
    <div class="stats">
      <div class="chip"><svg><use href="#i-time"/></svg><b id="time">--:--</b></div>
      <div class="chip"><svg><use href="#i-heart"/></svg><b id="lives">-/-</b></div>
      <div class="chip dmg"><svg><use href="#i-sword"/></svg><b id="total">0</b></div>
      <div class="boss" id="boss"><svg><use href="#i-skull"/></svg><div class="hp"><i id="hpbar" style="width:0"></i><span id="hptxt">—</span></div></div>
    </div>
    <div class="podium" id="podium"><div class="empty">Esperando datos del raid…</div></div>
    <div class="tabs">
      <button class="tab" data-tab="all" title="Todo"><svg><use href="#i-all"/></svg></button>
      <button class="tab" data-tab="dps" title="DPS al jefe"><svg><use href="#i-sword"/></svg></button>
      <button class="tab" data-tab="taken" title="Daño recibido"><svg><use href="#i-shield"/></svg></button>
      <button class="tab" data-tab="heal" title="Curación"><svg><use href="#i-heal"/></svg></button>
      <button class="tab" data-tab="perf" title="Rendimiento"><svg><use href="#i-star"/></svg></button>
    </div>
    <div class="list" id="list"><div class="empty">Esperando datos del raid…</div></div>
    <div class="foot"><b>$panel</b> ver otra vez · <b>$panel off</b> no abrir al terminar</div>
  </div>
<script>
(function () {
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('nlp.' + k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('nlp.' + k, v); } catch (e) {} }
  };
  var size = store.get('size', '1'), tab = store.get('tab', 'all'), last = null;
  // row: [id, name, isLeader, dps, bossDamage, taken, heal, deaths, perf, class, gender, spType]
  var cols = {
    dps:   { key: 3, icon: 'i-sword',  color: '#ffb066' },
    taken: { key: 5, icon: 'i-shield', color: '#ff6b6b' },
    heal:  { key: 6, icon: 'i-heal',   color: '#4ee07a' },
    perf:  { key: 8, icon: 'i-star',   color: '#ffd36b' }
  };
  function ic(id) { return '<svg><use href="#' + id + '"/></svg>'; }
  function fmt(n) { n = +n || 0; return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n)); }
  function mmss(s) { s = Math.max(0, s | 0); return (s / 60 | 0) + ':' + ('0' + s % 60).slice(-2); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function perfColor(p) { return p >= 85 ? '#ffb43c' : p >= 70 ? '#d48cff' : p >= 50 ? '#5fa8ff' : p >= 30 ? '#7ddc6a' : '#9aa7ba'; }
  // The game's own portraits: one per specialist card and gender, or per class and gender without one.
  function classFace(r) { return 32000 + 20 * (((+r[9] || 0) * 2) + (+r[10] ? 1 : 0)); }
  function face(r) {
    var sp = r[11] == null ? -1 : +r[11];
    var id = sp >= 0 ? 32500 + 2 * sp + (+r[10] ? 1 : 0) : classFace(r);
    return '<img src="caras/' + id + '.png" data-fb="caras/' + classFace(r) + '.png" alt="">';
  }
  function value(c, r, big) {
    var v = +r[cols[c].key] || 0;
    return c === 'perf'
      ? '<span class="val">' + (big ? ic('i-star') : '') + '<span class="perf" style="background:' + perfColor(v) + '">' + v + '</span></span>'
      : '<span class="val" style="color:' + cols[c].color + '">' + (big ? ic(cols[c].icon) : '') + fmt(v) + '</span>';
  }
  function ui() {
    document.documentElement.style.setProperty('--s', size);
    [].forEach.call(document.querySelectorAll('[data-size]'), function (b) { b.classList.toggle('on', b.getAttribute('data-size') === size); });
    [].forEach.call(document.querySelectorAll('[data-tab]'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
  }
  function render() {
    ui();
    var d = last; if (!d) return;
    document.getElementById('title').textContent = d.r || 'Raid';
    document.getElementById('time').textContent = mmss(d.t);
    document.getElementById('lives').textContent = (d.l || [0, 0]).join('/');
    var hp = d.b == null ? null : Math.max(0, Math.min(100, d.b));
    document.getElementById('boss').style.display = hp == null ? 'none' : '';
    document.getElementById('hpbar').style.width = (hp == null ? 0 : hp) + '%';
    document.getElementById('hptxt').textContent = hp == null ? '—' : hp + '%';
    document.getElementById('total').textContent = fmt((d.p || []).reduce(function (a, r) { return a + (+r[4] || 0); }, 0));

    var show = tab === 'all' ? ['dps', 'taken', 'heal', 'perf'] : [tab];
    var main = tab === 'all' ? cols.perf : cols[show[0]];
    var mainKey = tab === 'all' ? 'perf' : tab;
    var rows = (d.p || []).slice().sort(function (a, b) { return (b[main.key] || 0) - (a[main.key] || 0); });
    var max = Math.max.apply(null, rows.map(function (r) { return +r[main.key] || 0; }).concat([1]));

    // Top three, first in the middle.
    var pod = '';
    [1, 0, 2].forEach(function (i) {
      var r = rows[i]; if (!r) return;
      pod += '<div class="pd pd' + (i + 1) + '"><div class="ring">' + (r[2] ? '<svg class="crownTop"><use href="#i-crown"/></svg>' : '') +
        face(r) + '<span class="medal">' + (i + 1) + '</span></div><div class="pnm">' + esc(r[1]) + '</div><div class="pval">' +
        (mainKey === 'perf' ? value('perf', r, true) : value(mainKey, r, true)) + '</div></div>';
    });
    document.getElementById('podium').innerHTML = pod || '<div class="empty">Sin jugadores</div>';

    var h = '';
    rows.forEach(function (r, i) {
      h += '<div class="row' + (r[0] === d.me ? ' me' : '') + '"><span class="rank' + (i < 3 ? ' r' + (i + 1) : '') + '">' + (i + 1) + '</span>' +
        '<span class="ava">' + face(r).replace('<img ', '<img style="width:100%;height:100%;border-radius:50%;display:block" ') + '</span><div class="who">' +
        (r[2] ? ic('i-crown') : '') + '<span class="nm">' + esc(r[1]) + '</span>' +
        (r[7] ? '<span class="dead">' + ic('i-skull') + r[7] + '</span>' : '') + '</div><div class="vals">';
      show.forEach(function (c) { h += value(c, r, tab !== 'all'); });
      h += '</div>' + (tab === 'all' ? '' : '<i class="fill" style="width:' + Math.round((+r[main.key] || 0) / max * 100) + '%;background:' + main.color + ';color:' + main.color + '"></i>') + '</div>';
    });
    if (tab === 'all' && h) {
      h = '<div class="row head"><span class="rank"></span><span class="ava" style="border:none;background:none"></span><div class="who"></div><div class="vals">' +
        ['dps', 'taken', 'heal', 'perf'].map(function (c) { return '<span class="val">' + ic(cols[c].icon) + '</span>'; }).join('') + '</div></div>' + h;
    }
    document.getElementById('list').innerHTML = h || '<div class="empty">Sin jugadores</div>';
  }
  function read() {
    var raw = location.hash.slice(1); if (!raw) return;
    try { last = JSON.parse(decodeURIComponent(raw)); } catch (e) { return; }
    render();
  }
  document.addEventListener('error', function (e) {
    var img = e.target;
    if (img.tagName === 'IMG' && img.getAttribute('data-fb') && img.src.indexOf(img.getAttribute('data-fb')) < 0) img.src = img.getAttribute('data-fb');
  }, true);
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-size')) { size = b.getAttribute('data-size'); store.set('size', size); }
    if (b.hasAttribute('data-tab')) { tab = b.getAttribute('data-tab'); store.set('tab', tab); }
    render(); ui();
  });
  window.addEventListener('hashchange', read);
  ui(); read();
})();
</script>
</body>
</html>
