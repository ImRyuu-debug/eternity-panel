<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NosLegacy · Raid</title>
<style>
  :root { --s: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #2a1e14 linear-gradient(#3a2a1c, #1c140d);
    color: #f3e2b8; font: calc(12px * var(--s)) Tahoma, Verdana, sans-serif;
    user-select: none; overflow: hidden; display: flex; flex-direction: column;
  }
  .bar {
    display: flex; align-items: center; gap: 6px; padding: 5px 7px;
    background: linear-gradient(#5b4128, #3b2a19); border-bottom: 1px solid #a07a3c;
    box-shadow: inset 0 1px 0 #8c6a3a;
  }
  .title { font-weight: bold; color: #ffd774; text-shadow: 1px 1px 0 #000; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    cursor: pointer; padding: 2px 7px; border: 1px solid #9c7438; border-radius: 3px;
    background: linear-gradient(#6d4f2c, #4a3520); color: #f3e2b8; font: inherit; font-size: .92em;
    text-shadow: 1px 1px 0 #000;
  }
  .btn:hover { background: linear-gradient(#866238, #5a4027); }
  .btn.on { background: linear-gradient(#c79a45, #8c6526); color: #fff; border-color: #ffd774; }
  .tabs { display: flex; gap: 3px; padding: 5px 7px 0; background: #241910; flex-wrap: wrap; }
  .tabs .btn { border-radius: 4px 4px 0 0; border-bottom: none; }
  .info { display: flex; justify-content: space-between; gap: 8px; padding: 5px 9px; background: #1c140d; border-top: 1px solid #a07a3c; border-bottom: 1px solid #5a4027; font-size: .95em; }
  .info b { color: #ffd774; }
  .wrap { flex: 1; overflow-y: auto; padding: 6px; }
  .wrap::-webkit-scrollbar { width: 10px; }
  .wrap::-webkit-scrollbar-track { background: #1c140d; }
  .wrap::-webkit-scrollbar-thumb { background: #7a5a30; border: 1px solid #a07a3c; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: right; color: #ffd774; font-weight: bold; padding: 3px 5px; border-bottom: 1px solid #a07a3c; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 4px 5px; border-bottom: 1px solid #3d2c1b; white-space: nowrap; position: relative; }
  tr.me td { background: rgba(255, 215, 116, .10); }
  tr.me td:first-child { color: #ffd774; }
  .name { display: flex; align-items: center; gap: 5px; overflow: hidden; text-overflow: ellipsis; max-width: calc(120px * var(--s)); }
  .lead { color: #ff9a3c; font-size: .9em; }
  .barcell { position: relative; }
  .fill { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 2px; opacity: .35; }
  .v { position: relative; }
  .perf { font-weight: bold; }
  .p0 { color: #c9b896; } .p1 { color: #8fd17a; } .p2 { color: #6fb6ff; } .p3 { color: #d48cff; } .p4 { color: #ffb43c; }
  .dead { color: #ff6b5b; }
  .empty { text-align: center; color: #b8a27a; padding: 30px 10px; line-height: 1.6; }
  .foot { padding: 4px 8px; background: #1c140d; border-top: 1px solid #5a4027; color: #a8926a; font-size: .85em; text-align: center; }
</style>
</head>
<body>
  <div class="bar">
    <div class="title" id="title">Raid</div>
    <button class="btn" data-size="0.85">S</button>
    <button class="btn" data-size="1">M</button>
    <button class="btn" data-size="1.25">L</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="btn" data-tab="all">Todo</button>
    <button class="btn" data-tab="dps">DPS</button>
    <button class="btn" data-tab="taken">Recibido</button>
    <button class="btn" data-tab="heal">Curación</button>
    <button class="btn" data-tab="perf">Rendimiento</button>
  </div>
  <div class="info"><span>⏱ <b id="time">--:--</b></span><span>❤ <b id="lives">-/-</b></span><span>⚔ <b id="boss">-</b></span></div>
  <div class="wrap"><div id="body"><div class="empty">Esperando datos del raid…<br>El panel se actualiza solo durante el raid.</div></div></div>
  <div class="foot">Cierra con la ✕ · <b>$panel</b> para volver a abrirlo · <b>$panel off</b> para no verlo más</div>
<script>
(function () {
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('nlp.' + k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('nlp.' + k, v); } catch (e) {} }
  };
  var size = store.get('size', '1'), tab = store.get('tab', 'all'), last = null;
  var cols = {
    dps:   { label: 'DPS',      key: 3, color: '#ff7a3c' },
    taken: { label: 'Recibido', key: 5, color: '#ff4d4d' },
    heal:  { label: 'Curación', key: 6, color: '#5be06b' },
    perf:  { label: 'Rend.',    key: 8, color: '#ffd774' }
  };
  function fmt(n) {
    n = +n || 0;
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k';
    return Math.round(n).toLocaleString('es-ES');
  }
  function mmss(s) { s = Math.max(0, s | 0); return (s / 60 | 0) + ':' + ('0' + s % 60).slice(-2); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function perfClass(p) { return p >= 85 ? 'p4' : p >= 70 ? 'p3' : p >= 50 ? 'p2' : p >= 30 ? 'p1' : 'p0'; }
  function applyUi() {
    document.documentElement.style.setProperty('--s', size);
    [].forEach.call(document.querySelectorAll('[data-size]'), function (b) { b.classList.toggle('on', b.getAttribute('data-size') === size); });
    [].forEach.call(document.querySelectorAll('[data-tab]'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
  }
  // p: [id, name, isLeader, dps, dmgBoss, taken, heal, deaths, perf]
  function render() {
    applyUi();
    var d = last;
    if (!d) return;
    document.getElementById('title').textContent = d.r || 'Raid';
    document.getElementById('time').textContent = mmss(d.t);
    document.getElementById('lives').textContent = (d.l || [0, 0]).join('/');
    document.getElementById('boss').textContent = d.b == null ? '-' : d.b + '%';
    var show = tab === 'all' ? ['dps', 'taken', 'heal', 'perf'] : [tab];
    var rows = (d.p || []).slice();
    var sortKey = cols[show[0]].key;
    rows.sort(function (a, b) { return (b[sortKey] || 0) - (a[sortKey] || 0); });
    var max = {};
    show.forEach(function (c) { max[c] = Math.max.apply(null, rows.map(function (r) { return +r[cols[c].key] || 0; }).concat([1])); });
    var h = '<table><tr><th>Jugador</th>';
    show.forEach(function (c) { h += '<th>' + cols[c].label + '</th>'; });
    h += '</tr>';
    rows.forEach(function (r) {
      h += '<tr' + (r[0] === d.me ? ' class="me"' : '') + '><td><div class="name">' + (r[2] ? '<span class="lead">♛</span>' : '') +
        esc(r[1]) + (r[7] ? ' <span class="dead">✝' + r[7] + '</span>' : '') + '</div></td>';
      show.forEach(function (c) {
        var v = +r[cols[c].key] || 0;
        if (c === 'perf') { h += '<td class="perf ' + perfClass(v) + '">' + v + '</td>'; return; }
        var w = tab === 'all' ? 0 : Math.round(v / max[c] * 100);
        h += '<td class="barcell">' + (w ? '<div class="fill" style="width:' + w + '%;background:' + cols[c].color + '"></div>' : '') +
          '<span class="v">' + fmt(v) + '</span></td>';
      });
      h += '</tr>';
    });
    document.getElementById('body').innerHTML = h + '</table>';
  }
  function read() {
    var raw = location.hash.slice(1);
    if (!raw) return;
    try { last = JSON.parse(decodeURIComponent(raw)); } catch (e) { return; }
    render();
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-size')) { size = b.getAttribute('data-size'); store.set('size', size); }
    if (b.hasAttribute('data-tab')) { tab = b.getAttribute('data-tab'); store.set('tab', tab); }
    render(); applyUi();
  });
  window.addEventListener('hashchange', read);
  applyUi(); read();
})();
</script>
</body>
</html>
